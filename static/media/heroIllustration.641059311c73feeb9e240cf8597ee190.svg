<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620">
  <defs>
    <linearGradient id="h_bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="h_laptopTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="h_laptopSideR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2540"/>
      <stop offset="100%" stop-color="#1a1729"/>
    </linearGradient>
    <linearGradient id="h_laptopSideL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241f38"/>
      <stop offset="100%" stop-color="#161320"/>
    </linearGradient>
    <linearGradient id="h_screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#100e1a"/>
    </linearGradient>
    <linearGradient id="h_cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2540"/>
      <stop offset="100%" stop-color="#1a1729"/>
    </linearGradient>
    <radialGradient id="h_orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="350" cy="320" r="290" fill="url(#h_bgGlow)"/>
  <circle cx="580" cy="130" r="90" fill="url(#h_orb)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="480" r="75" fill="url(#h_orb)">
    <animate attributeName="opacity" values="1;0.6;1" dur="4.6s" repeatCount="indefinite"/>
  </circle>

  <ellipse cx="350" cy="320" rx="270" ry="185" fill="none" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="0 350 320" to="360 350 320" dur="42s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="350" cy="320" rx="210" ry="250" fill="none" stroke="#a78bfa" stroke-opacity="0.13" stroke-width="1.5" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="360 350 320" to="0 350 320" dur="55s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="350" cy="470" rx="200" ry="36" fill="#0f1117" opacity="0.5"/>

  <!-- isometric open laptop -->
  <g transform="translate(350,380)">
    <animateTransform attributeName="transform" type="translate" values="350,380; 350,368; 350,380" dur="6s" repeatCount="indefinite"/>

    <polygon points="0,20 190,-50 190,-20 0,50" fill="url(#h_laptopSideR)"/>
    <polygon points="0,20 -190,-50 -190,-20 0,50" fill="url(#h_laptopSideL)"/>
    <polygon points="0,-80 190,-50 0,20 -190,-50" fill="url(#h_laptopTop)"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="0; -3; 0" dur="6s" repeatCount="indefinite"/>
      <polygon points="0,-80 -190,-140 -190,-290 0,-230" fill="url(#h_screenGrad)" stroke="#3a3552" stroke-width="1.5"/>
      <g font-family="Menlo, Consolas, monospace" font-size="10" transform="translate(-165,-260) skewY(-18)">
        <rect x="0" y="0" width="70" height="6" rx="3" fill="#a78bfa" opacity="0.85"/>
        <rect x="0" y="14" width="95" height="5" rx="2.5" fill="#4c3f7a"/>
        <rect x="0" y="26" width="60" height="5" rx="2.5" fill="#4c3f7a"/>
        <rect x="0" y="38" width="80" height="5" rx="2.5" fill="#34d399" opacity="0.8"/>
        <rect x="0" y="50" width="50" height="5" rx="2.5" fill="#4c3f7a"/>
        <rect x="0" y="62" width="75" height="5" rx="2.5" fill="#4c3f7a"/>
        <rect x="0" y="74" width="8" height="10" fill="#a78bfa">
          <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- floating API response card -->
  <g transform="translate(480,150)">
    <animateTransform attributeName="transform" type="translate" values="480,150; 480,136; 480,150" dur="5s" repeatCount="indefinite"/>
    <rect x="-85" y="-45" width="170" height="90" rx="12" fill="url(#h_cardGrad)" stroke="#4c3f7a" stroke-width="1.5"/>
    <circle cx="-62" cy="-24" r="7" fill="#34d399"/>
    <path d="M-66,-24 l3,3 l6,-6" stroke="#0f1117" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-46" y="-20" font-family="Menlo, Consolas, monospace" font-size="10" fill="#a78bfa">200 OK</text>
    <rect x="-62" y="-4" width="130" height="6" rx="3" fill="#3a3552"/>
    <rect x="-62" y="-4" width="95" height="6" rx="3" fill="url(#h_laptopTop)"/>
    <rect x="-62" y="12" width="90" height="6" rx="3" fill="#3a3552"/>
    <rect x="-62" y="12" width="55" height="6" rx="3" fill="url(#h_laptopTop)"/>
  </g>

  <!-- isometric database cylinder -->
  <g transform="translate(140,190)">
    <animateTransform attributeName="transform" type="translate" values="140,190; 140,178; 140,190" dur="5.6s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="52" ry="16" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M-52,0 v28 a52,16 0 0 0 104,0 v-28" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M-52,26 v28 a52,16 0 0 0 104,0 v-28" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="0" y="88" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8b85a3">PostgreSQL</text>
  </g>

  <g font-family="Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <rect x="500" y="330" width="76" height="30" rx="15" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="538" y="350" text-anchor="middle" fill="#a78bfa">Python</text>

    <rect x="70" y="380" width="94" height="30" rx="15" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="117" y="400" text-anchor="middle" fill="#a78bfa">Gemini AI</text>
  </g>

  <circle cx="610" cy="420" r="4" fill="#a78bfa">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="630" cy="450" r="3" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="200" r="4" fill="#a78bfa">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="240" r="3" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
