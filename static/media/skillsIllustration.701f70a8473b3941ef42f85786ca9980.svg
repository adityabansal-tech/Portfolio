<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640">
  <defs>
    <linearGradient id="sk_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="sk_topA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sk_topB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="sk_topC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7ad1"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <linearGradient id="sk_sideR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b3357"/>
      <stop offset="100%" stop-color="#1e1a2e"/>
    </linearGradient>
    <linearGradient id="sk_sideL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2440"/>
      <stop offset="100%" stop-color="#151221"/>
    </linearGradient>

    <linearGradient id="sk_screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221d35"/>
      <stop offset="100%" stop-color="#100d1a"/>
    </linearGradient>
    <linearGradient id="sk_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2540"/>
      <stop offset="100%" stop-color="#191527"/>
    </linearGradient>

    <radialGradient id="sk_orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sk_orbG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient depth -->
  <ellipse cx="450" cy="330" rx="420" ry="300" fill="url(#sk_glow)"/>
  <circle cx="150" cy="140" r="95" fill="url(#sk_orb)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="200" r="80" fill="url(#sk_orbG)">
    <animate attributeName="opacity" values="1;0.5;1" dur="3.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="500" r="90" fill="url(#sk_orb)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5.2s" repeatCount="indefinite"/>
  </circle>

  <!-- orbit rings -->
  <ellipse cx="450" cy="330" rx="400" ry="215" fill="none" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="0 450 330" to="360 450 330" dur="48s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="330" rx="300" ry="270" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="360 450 330" to="0 450 330" dur="62s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ground shadow -->
  <ellipse cx="450" cy="545" rx="260" ry="46" fill="#0b0912" opacity="0.55"/>

  <!-- ===== layered isometric platform stack (3 tiers = depth) ===== -->
  <g transform="translate(450,470)">
    <animateTransform attributeName="transform" type="translate" values="450,470; 450,458; 450,470" dur="6.5s" repeatCount="indefinite"/>
    <!-- tier 3 (bottom, widest) -->
    <polygon points="0,26 250,-64 250,-22 0,68" fill="url(#sk_sideR)"/>
    <polygon points="0,26 -250,-64 -250,-22 0,68" fill="url(#sk_sideL)"/>
    <polygon points="0,-64 250,-64 0,26 -250,-64" fill="url(#sk_topC)" opacity="0.95"/>
  </g>

  <g transform="translate(450,392)">
    <animateTransform attributeName="transform" type="translate" values="450,392; 450,381; 450,392" dur="6.5s" repeatCount="indefinite"/>
    <!-- tier 2 (middle) -->
    <polygon points="0,22 195,-48 195,-12 0,58" fill="url(#sk_sideR)"/>
    <polygon points="0,22 -195,-48 -195,-12 0,58" fill="url(#sk_sideL)"/>
    <polygon points="0,-48 195,-48 0,22 -195,-48" fill="url(#sk_topB)"/>
  </g>

  <g transform="translate(450,318)">
    <animateTransform attributeName="transform" type="translate" values="450,318; 450,308; 450,318" dur="6.5s" repeatCount="indefinite"/>
    <!-- tier 1 (top, smallest) -->
    <polygon points="0,18 140,-34 140,-6 0,46" fill="url(#sk_sideR)"/>
    <polygon points="0,18 -140,-34 -140,-6 0,46" fill="url(#sk_sideL)"/>
    <polygon points="0,-34 140,-34 0,18 -140,-34" fill="url(#sk_topA)"/>
  </g>

  <!-- floating monitor above the stack -->
  <g transform="translate(450,180)">
    <animateTransform attributeName="transform" type="translate" values="450,180; 450,166; 450,180" dur="5.4s" repeatCount="indefinite"/>
    <rect x="-118" y="-86" width="236" height="164" rx="12" fill="url(#sk_screen)" stroke="#463c6b" stroke-width="1.8"/>
    <rect x="-118" y="-86" width="236" height="26" rx="12" fill="#2b2442"/>
    <rect x="-118" y="-72" width="236" height="12" fill="#2b2442"/>
    <circle cx="-102" cy="-73" r="4.5" fill="#f87171"/>
    <circle cx="-88" cy="-73" r="4.5" fill="#fbbf24"/>
    <circle cx="-74" cy="-73" r="4.5" fill="#34d399"/>

    <rect x="-96" y="-44" width="92" height="8" rx="4" fill="#a78bfa" opacity="0.9"/>
    <rect x="-96" y="-26" width="140" height="7" rx="3.5" fill="#4c3f7a"/>
    <rect x="-96" y="-10" width="108" height="7" rx="3.5" fill="#4c3f7a"/>
    <rect x="-96" y="6" width="128" height="7" rx="3.5" fill="#34d399" opacity="0.85"/>
    <rect x="-96" y="22" width="84" height="7" rx="3.5" fill="#4c3f7a"/>
    <rect x="-96" y="38" width="116" height="7" rx="3.5" fill="#4c3f7a"/>
    <rect x="26" y="38" width="9" height="11" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- left: isometric database stack -->
  <g transform="translate(150,330)">
    <animateTransform attributeName="transform" type="translate" values="150,330; 150,318; 150,330" dur="5.8s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="58" ry="18" fill="none" stroke="#a78bfa" stroke-width="2.6"/>
    <path d="M-58,0 v30 a58,18 0 0 0 116,0 v-30" fill="none" stroke="#a78bfa" stroke-width="2.6"/>
    <path d="M-58,28 v30 a58,18 0 0 0 116,0 v-30" fill="none" stroke="#8b5cf6" stroke-width="2.6"/>
    <path d="M-58,56 v30 a58,18 0 0 0 116,0 v-30" fill="none" stroke="#6d28d9" stroke-width="2.6"/>
    <text x="0" y="124" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9089a8">PostgreSQL</text>
  </g>

  <!-- right: API status card -->
  <g transform="translate(742,300)">
    <animateTransform attributeName="transform" type="translate" values="742,300; 742,286; 742,300" dur="5s" repeatCount="indefinite"/>
    <rect x="-92" y="-52" width="184" height="104" rx="14" fill="url(#sk_card)" stroke="#4c3f7a" stroke-width="1.8"/>
    <circle cx="-66" cy="-28" r="8" fill="#34d399"/>
    <path d="M-70.5,-28 l3.5,3.5 l7,-7" stroke="#0f1117" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-48" y="-23" font-family="Menlo, Consolas, monospace" font-size="11" fill="#a78bfa">200 OK</text>
    <text x="-66" y="-4" font-family="Menlo, Consolas, monospace" font-size="9" fill="#7d7595">REST / JSON</text>
    <rect x="-66" y="8" width="132" height="7" rx="3.5" fill="#3a3552"/>
    <rect x="-66" y="8" width="98" height="7" rx="3.5" fill="url(#sk_topA)"/>
    <rect x="-66" y="24" width="92" height="7" rx="3.5" fill="#3a3552"/>
    <rect x="-66" y="24" width="58" height="7" rx="3.5" fill="url(#sk_topA)"/>
  </g>

  <!-- connecting data lines -->
  <path d="M208,352 C270,392 330,404 360,410" fill="none" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 6"/>
  <path d="M650,318 C600,344 560,372 540,388" fill="none" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 6"/>
  <path d="M450,262 L450,290" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="4 6"/>

  <!-- orbiting tech chips -->
  <g font-family="Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-9; 0,0" dur="4.4s" repeatCount="indefinite"/>
      <rect x="112" y="150" width="82" height="32" rx="16" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.3"/>
      <text x="153" y="171" text-anchor="middle" fill="#a78bfa">Python</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-11; 0,0" dur="5.1s" repeatCount="indefinite"/>
      <rect x="672" y="120" width="76" height="32" rx="16" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.3"/>
      <text x="710" y="141" text-anchor="middle" fill="#a78bfa">Flask</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4.8s" repeatCount="indefinite"/>
      <rect x="92" y="470" width="104" height="32" rx="16" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.3"/>
      <text x="144" y="491" text-anchor="middle" fill="#a78bfa">Gemini AI</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="5.5s" repeatCount="indefinite"/>
      <rect x="700" y="452" width="86" height="32" rx="16" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.3"/>
      <text x="743" y="473" text-anchor="middle" fill="#a78bfa">Docker</text>
    </g>
  </g>

  <!-- sparkle dots -->
  <circle cx="820" cy="360" r="4" fill="#a78bfa">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="260" r="3.5" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="90" r="3.5" fill="#34d399">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="560" r="3.5" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0.4;1" dur="3.3s" repeatCount="indefinite"/>
  </circle>
</svg>
